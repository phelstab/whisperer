[package]
name = "whisperer"
version = "0.1.0" # unused: the app version is the topmost "== V<x.y.z>" heading of README.adoc (see build.rs)
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "3", default-features = false, features = ["native-tls", "json"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_Registry", "Win32_Security"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
