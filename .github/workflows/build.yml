name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # create releases

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - run: cargo test --locked
      - run: cargo build --release --locked

      # Version and release notes come from the topmost "== V1.2.3 - ..." section of README.adoc.
      # build.rs reads the same heading, so the exe knows its own version for the updater.
      - name: Read version
        id: version
        run: |
          version=$(sed -nE 's/^== V([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' README.adoc | head -n 1)
          test -n "$version" || { echo "no '== V<x.y.z>' heading in README.adoc"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          awk '/^== V/ { n++; next } n == 1 && /^[-*] /' README.adoc > notes.md
          cp target/release/whisperer.exe "whisperer-v$version.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: whisperer-v${{ steps.version.outputs.version }}
          path: whisperer-v${{ steps.version.outputs.version }}.exe

      # The updater looks for the asset named exactly "whisperer-<tag>.exe" on the latest release.
      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.version }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists; bump the version in README.adoc to publish a new one."
            exit 0
          fi
          gh release create "$TAG" "whisperer-$TAG.exe" --title "$TAG" --notes-file notes.md --target "$GITHUB_SHA"
